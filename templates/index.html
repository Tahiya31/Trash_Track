<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trash Annotation App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep: #04161f;          /* abyss background */
      --teal: #16c2b3;          /* tidal teal (brighter for dark) */
      --teal-bright: #2ee0cf;   /* shallow water */
      --kelp: #3fbf78;          /* kelp green */
      --kelp-bright: #5fe39a;
      --sand: #061f2a;          /* page background (deep ocean) */
      --surface: #0c2c38;       /* card surface */
      --ink: #eaf6f5;           /* primary text */
      --muted: #8fb3bb;         /* secondary text */
      --line: #18424f;          /* hairline borders */
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.5);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 560px at 100% -10%, rgba(22, 194, 179, 0.16), transparent 60%),
        radial-gradient(900px 520px at -10% 110%, rgba(63, 191, 120, 0.14), transparent 55%),
        var(--sand);
    }

    /* ---------- Nav ---------- */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 18px 16px;
      background: rgba(6, 31, 42, 0.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .button-36 {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      height: 2.6rem;
      padding: 0 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease, transform 0.08s ease, box-shadow 0.18s ease;
    }
    .button-36:hover {
      color: var(--deep);
      background: rgba(15, 138, 138, 0.09);
    }
    .button-36:active { transform: scale(0.96); }
    .button-36:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    /* primary action buttons (submit / revise) get filled treatment */
    #submit-button, #finalize {
      background-image: linear-gradient(120deg, var(--teal) 0%, var(--kelp) 100%);
      color: #fff;
      box-shadow: var(--shadow);
    }
    #submit-button:hover, #finalize:hover {
      color: #fff;
      box-shadow: var(--shadow-lg);
      transform: translateY(-1px);
    }

    /* ---------- Header ---------- */
    header { text-align: center; padding: 48px 20px 8px; }
    header h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      background-image: linear-gradient(100deg, var(--deep), var(--teal-bright) 55%, var(--kelp-bright));
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }
    .subtitle {
      color: var(--muted);
      font-size: 17px;
      margin: 12px auto 0;
      max-width: 540px;
      line-height: 1.5;
    }

    /* ---------- Upload card ---------- */
    .panel {
      max-width: 680px;
      margin: 32px auto 0;
      padding: 0 20px;
    }
    .upload-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      text-align: center;
    }
    .dropzone {
      border: 2px dashed #2a5663;
      border-radius: var(--radius);
      padding: 36px 20px;
      transition: border-color 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }
    .dropzone.dragover {
      border-color: var(--teal);
      background: rgba(21, 179, 166, 0.06);
    }
    .dropzone-icon {
      width: 52px; height: 52px;
      margin: 0 auto 14px;
      color: var(--teal);
    }
    .dropzone-text { font-weight: 600; font-size: 17px; margin-bottom: 4px; }
    .dropzone-hint { color: var(--muted); font-size: 14px; }
    .file-count {
      margin-top: 14px; font-size: 14px; font-weight: 600; color: var(--teal);
      min-height: 18px;
    }

    /* keep the original input id but visually hide it; dropzone triggers it */
    .customfile {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); border: 0;
    }

    #submit-button {
      margin: 22px auto 0;
      display: inline-flex;
      height: 3rem;
      padding: 0 2.4rem;
      font-size: 16px;
      border-radius: 10px;
    }

    /* ---------- Loader ---------- */
    .loader {
      border: 5px solid rgba(15, 138, 138, 0.15);
      border-top: 5px solid var(--teal);
      border-radius: 50%;
      width: 54px; height: 54px;
      animation: spin 0.9s linear infinite;
      display: none;
      margin: 30px auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-status {
      text-align: center; font-size: 16px; color: var(--muted); font-weight: 500;
    }

    /* ---------- Results ---------- */
    #results {
      max-width: 1000px;
      margin: 8px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .result-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .result-card img {
      width: 100%;
      max-width: 180px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #08242e;
    }
    .result-coords {
      font-size: 12px; color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      text-align: center; word-break: break-word;
    }
    #drop-down {
      height: 2.5rem;
      width: 100%;
      max-width: 180px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #08242e;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 0 10px;
      cursor: pointer;
    }
    #drop-down:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
    .drop-down-content { color: #0c2a36; }
    #finalize {
      height: 2.5rem;
      width: 100%;
      max-width: 180px;
      border-radius: 9px;
      font-size: 14px;
    }
    .result-actions {
      display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <nav class="buttons-container">
    <a class="button-36" href="./">Home</a>
    <a class="button-36" href="./csv/">CSV</a>
    <a class="button-36" href="./overlap/">Duplicates</a>
    <a class="button-36" href="./map/">Map</a>
    <a class="button-36" href="./plots/">Plot</a>
    <a class="button-36" href="./about/">About</a>
    <a class="button-36" href="/add/">Add</a>
  </nav>

  <header>
    <h1>Trash Annotation App</h1>
    <p class="subtitle">Upload aerial drone imagery to automatically detect, classify, and map marine debris along the coastline.</p>
  </header>

  <div class="panel">
    <div class="upload-card">
      <div class="dropzone" id="dropzone">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <div class="dropzone-text">Drop drone images here</div>
        <div class="dropzone-hint">or click to browse &middot; JPG, multiple files supported</div>
        <input class="customfile" type="file" id="image-selector" multiple />
        <div class="file-count" id="file-count"></div>
      </div>
      <button class="button-36" id="submit-button">Detect debris</button>
    </div>
  </div>

  <div class="loader" id="loader"></div>
  <div class="loading-status" id="loading-status"></div>

  <div id="results"></div>

  <script>
    const submitButton = document.getElementById("submit-button");
    const resultsDiv = document.getElementById("results");
    const loader = document.getElementById("loader");
    const loadingStatus = document.getElementById("loading-status");

    // --- dropzone wiring (purely cosmetic; still uses #image-selector) ---
    const dropzone = document.getElementById("dropzone");
    const imageSelector = document.getElementById("image-selector");
    const fileCount = document.getElementById("file-count");

    dropzone.addEventListener("click", () => imageSelector.click());
    imageSelector.addEventListener("change", () => updateCount());
    ["dragenter", "dragover"].forEach(evt =>
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("dragover"); })
    );
    ["dragleave", "drop"].forEach(evt =>
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("dragover"); })
    );
    dropzone.addEventListener("drop", (e) => {
      imageSelector.files = e.dataTransfer.files;
      updateCount();
    });
    function updateCount() {
      const n = imageSelector.files.length;
      fileCount.textContent = n ? `${n} image${n > 1 ? "s" : ""} selected` : "";
    }

    submitButton
      .addEventListener("click", () => {
        const imageInput = document.getElementById("image-selector");
        const formData = new FormData();

        let totalFiles = imageInput.files.length;
        if (totalFiles === 0) {
          return;
        }

        // Show loader
        loader.style.display = "block";
        loadingStatus.textContent = `Processing ${totalFiles} Image(s)`;

        for (let i = 0; i < totalFiles; i++) {
          formData.append("img_directory", imageInput.files[i]);
        }

        fetch("/process_images", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            // Hide loader
            loader.style.display = "none";

            resultsDiv.innerHTML = ""; // clear previous results

            data.predicted_classes.forEach((row, i) => {
              const div = document.createElement("div");
              div.className = "result-card";

              const p = document.createElement("p");
              p.className = "result-coords";
              p.textContent = row[0] + ", " + row[1] + ", " + row[2];
              div.appendChild(p);

              const img = document.createElement("img");
              img.src = "data:image/jpg;base64," + data.crops[i];
              img.width = 100;
              div.appendChild(img);

              const actionDiv = document.createElement("div");
              actionDiv.className = "result-actions";

              const select = document.createElement("select");
              select.className = "button-36";
              select.id = "drop-down";
              const classes = [
                "plastic",
                "cage",
                "wood",
                "fishing gear",
                "nature",
                "metal",
                "wheel",
                "repeated trash",
              ]; // List of classes
              classes.forEach((cls) => {
                const option = document.createElement("option");
                option.text = cls;
                option.value = cls;
                option.className = "drop-down-content";
                if (cls === row[2]) {
                  option.selected = true;
                }
                select.appendChild(option);
              });

              const button = document.createElement("button");
              button.className = "button-36";
              button.id = "finalize";
              button.textContent = "Revise";
              button.addEventListener("click", () => {
                fetch(`/update_class?index=${i}&new_class=${select.value}`)
                  .then((response) => response.json())
                  .then((data) => {

                  });
              });

              actionDiv.appendChild(select);
              actionDiv.appendChild(button);

              div.appendChild(actionDiv);

              resultsDiv.appendChild(div);
            });
          });

        loadingStatus.textContent = "";
      })
      .catch((error) => {

        loader.style.display = "none";

        loadingStatus.textContent = "";
      });
  </script>
</body>

</html>
