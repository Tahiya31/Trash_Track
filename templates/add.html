<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Debris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --deep: #04161f;
      --teal: #16c2b3;
      --teal-bright: #2ee0cf;
      --kelp: #3fbf78;
      --kelp-bright: #5fe39a;
      --sand: #061f2a;
      --surface: #0c2c38;
      --surface-2: #08242e;
      --ink: #eaf6f5;
      --muted: #8fb3bb;
      --line: #18424f;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.5);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 560px at 100% -10%, rgba(22, 194, 179, 0.16), transparent 60%),
        radial-gradient(900px 520px at -10% 110%, rgba(63, 191, 120, 0.14), transparent 55%),
        var(--sand);
    }

    /* ---------- Nav ---------- */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 18px 16px;
      background: rgba(6, 31, 42, 0.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .button-36 {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      height: 2.6rem;
      padding: 0 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease, transform 0.08s ease, box-shadow 0.18s ease;
    }
    .button-36:hover { color: var(--teal-bright); background: rgba(22, 194, 179, 0.10); }
    .button-36:active { transform: scale(0.96); }
    .button-36:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    .btn-primary {
      background-image: linear-gradient(120deg, var(--teal) 0%, var(--kelp) 100%);
      color: #fff;
      box-shadow: var(--shadow);
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary:hover { color: #fff; box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    
    .btn-secondary {
      background: var(--surface-2);
      border: 1px solid var(--teal);
      color: var(--teal-bright);
      width: 100%;
      margin-bottom: 20px;
    }
    .btn-secondary:hover { background: rgba(22, 194, 179, 0.15); }

    /* ---------- Header ---------- */
    header { text-align: center; padding: 44px 20px 8px; }
    header h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(32px, 5.5vw, 54px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      background-image: linear-gradient(100deg, #cfeeec, var(--teal-bright) 55%, var(--kelp-bright));
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
    }
    .subtitle {
      color: var(--muted);
      font-size: 16px;
      margin: 12px auto 0;
      max-width: 560px;
      line-height: 1.55;
    }

    /* ---------- Form Card ---------- */
    .panel { max-width: 480px; margin: 28px auto 60px; padding: 0 20px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 26px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    
    input[type="number"], input[type="text"], select {
      width: 100%;
      height: 2.8rem;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      padding: 0 14px;
      transition: outline 0.2s ease;
    }
    input[type="number"]:focus-visible, input[type="text"]:focus-visible, select:focus-visible {
      outline: 2px solid var(--teal); outline-offset: 1px;
    }
    
    #status-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }
    .success { color: var(--kelp-bright); }
    .error { color: #ff6b6b; }

  </style>
</head>
<body>
  
  <nav class="buttons-container">
    <a class="button-36" href="/">Home</a>
    <a class="button-36" href="/csv/">CSV</a>
    <a class="button-36" href="/overlap/">Duplicates</a>
    <a class="button-36" href="/map/">Map</a>
    <a class="button-36" href="/plots/">Plot</a>
    <!-- Added new Add tab as requested by the user's slide -->
    <a class="button-36" href="/add/" style="color: var(--teal-bright);">Add</a>
  </nav>

  <header>
    <h1>Report Debris</h1>
    <p class="subtitle">Manually log the location of marine debris that may be occluded from aerial drone views. Use your device's GPS or enter coordinates manually.</p>
  </header>

  <div class="panel">
    <div class="card">
      <button class="button-36 btn-secondary" id="gps-button">
        📍 Get My Current Location
      </button>

      <div class="form-group">
        <label for="latitude">Latitude</label>
        <input type="number" id="latitude" step="any" placeholder="e.g., 44.5638" required />
      </div>

      <div class="form-group">
        <label for="longitude">Longitude</label>
        <input type="number" id="longitude" step="any" placeholder="e.g., -69.6628" required />
      </div>

      <div class="form-group">
        <label for="debris-type">Debris Type</label>
        <select id="debris-type">
          <option value="plastic">Plastic</option>
          <option value="fishing gear">Fishing Gear</option>
          <option value="wood">Wood</option>
          <option value="metal">Metal</option>
          <option value="cage">Cage</option>
          <option value="wheel">Wheel</option>
          <option value="nature">Nature</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Notes / Description (Optional)</label>
        <input type="text" id="description" placeholder="e.g., Partially buried under rocks" />
      </div>

      <button class="button-36 btn-primary" id="submit-manual">Submit Report</button>
      
      <div id="status-msg"></div>
    </div>
  </div>

  <script>
    const latInput = document.getElementById("latitude");
    const lonInput = document.getElementById("longitude");
    const typeInput = document.getElementById("debris-type");
    const descInput = document.getElementById("description");
    const gpsBtn = document.getElementById("gps-button");
    const submitBtn = document.getElementById("submit-manual");
    const statusMsg = document.getElementById("status-msg");

    // Handle Native GPS Location
    gpsBtn.addEventListener("click", () => {
      statusMsg.textContent = "Fetching location...";
      statusMsg.className = "";
      
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            latInput.value = position.coords.latitude.toFixed(6);
            lonInput.value = position.coords.longitude.toFixed(6);
            statusMsg.textContent = "Location acquired successfully!";
            statusMsg.className = "success";
          },
          (error) => {
            console.error(error);
            statusMsg.textContent = "Unable to retrieve location. Please ensure location permissions are enabled.";
            statusMsg.className = "error";
          },
          { enableHighAccuracy: true } // Request best possible GPS accuracy for mobile
        );
      } else {
        statusMsg.textContent = "Geolocation is not supported by your browser.";
        statusMsg.className = "error";
      }
    });

    // Handle Form Submission
    submitBtn.addEventListener("click", () => {
      const lat = latInput.value;
      const lon = lonInput.value;
      const type = typeInput.value;
      const desc = descInput.value || "Manual Report";

      if (!lat || !lon) {
        statusMsg.textContent = "Please provide both Latitude and Longitude.";
        statusMsg.className = "error";
        return;
      }

      statusMsg.textContent = "Submitting...";
      statusMsg.className = "";
      submitBtn.disabled = true;

      // Construct JSON payload
      const payload = {
        latitude: lat,
        longitude: lon,
        type: type,
        description: desc
      };

      // Send to Flask backend
      fetch("/add_manual_detection", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if(data.message) {
            statusMsg.textContent = "Debris reported successfully! It will now appear on the map.";
            statusMsg.className = "success";
            
            // Clear inputs after short delay
            setTimeout(() => {
                latInput.value = "";
                lonInput.value = "";
                descInput.value = "";
                statusMsg.textContent = "";
            }, 3000);
        } else {
            throw new Error("Invalid response");
        }
      })
      .catch(error => {
        console.error("Error:", error);
        statusMsg.textContent = "Error submitting report. Please try again.";
        statusMsg.className = "error";
      })
      .finally(() => {
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
